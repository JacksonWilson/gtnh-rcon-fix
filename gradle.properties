# Build settings for the GTNH ExampleMod1.7.10 convention plugin. See
# https://github.com/GTNewHorizons/ExampleMod1.7.10/blob/main/gradle.properties for every option.

gtnh.settings.blowdryerTag = 0.2.2

# Dev runs use Java 8, like the Akliz server. The modern Java module would add GTNHLib 0.11.x and its GTNHExtLib
# dependency, which Windows Defender quarantines.
gtnh.modules.modernJava = false

modName = RCON Fix
modId = rconfix
modGroup = com.rconfix
useModGroupForPublishing = true
autoUpdateBuildScript = false

minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

developmentEnvironmentUserName = Developer

# Java 17+ syntax compiled to Java 8 bytecode. Only Java 8 library APIs are available, because the
# Akliz server runs Java 8.
enableModernJavaSyntax = jabel
enableGenericInjection = true

generateGradleTokenClass = com.rconfix.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =
apiPackage =
accessTransformersFile =

# The RCON classes are vanilla server classes, so the Mixins load early through a core mod.
usesMixins = true
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage = mixins
coreModClass = core.RconFixCore
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true

includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false

modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeEnvironments = server
curseForgeRelations =

org.gradle.configuration-cache = true
org.gradle.parallel = true

# Keep builds light enough to run while Minecraft is open on the same PC.
org.gradle.jvmargs = -Xmx2g
org.gradle.workers.max = 6
